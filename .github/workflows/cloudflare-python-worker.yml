name: Deploy Python app to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - migration/python-only-web-app
    paths:
      - "python_backend/**"
      - ".github/workflows/cloudflare-python-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment credentials
        id: gate
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Install Python
        if: steps.gate.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Node.js
        if: steps.gate.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        if: steps.gate.outputs.configured == 'true'
        uses: astral-sh/setup-uv@v6

      - name: Install Python Worker tooling
        if: steps.gate.outputs.configured == 'true'
        working-directory: python_backend
        run: uv sync

      - name: Deploy to Cloudflare Workers
        if: steps.gate.outputs.configured == 'true'
        working-directory: python_backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          UPSTREAM_TIMEOUT_SECONDS: ${{ secrets.UPSTREAM_TIMEOUT_SECONDS }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          test -n "$FLASK_SECRET_KEY"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$GEMINI_API_KEY"
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          python - <<'PY' > "$secret_file"
          import json, os
          names = [
              "FLASK_SECRET_KEY",
              "SUPABASE_URL",
              "SUPABASE_ANON_KEY",
              "SUPABASE_SERVICE_ROLE_KEY",
              "GEMINI_API_KEY",
              "GEMINI_MODEL",
              "UPSTREAM_TIMEOUT_SECONDS",
              "ALLOWED_ORIGINS",
          ]
          print(json.dumps({name: os.environ[name] for name in names if os.environ.get(name)}))
          PY
          uv run pywrangler deploy --secrets-file "$secret_file"
