name: Deploy Ask AI Edge Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/ask-garment-data/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-ask-ai.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ask-ai-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Ask AI regression tests
        run: node --test supabase/functions/ask-garment-data/benchmark-source-regression.test.mjs

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Validate deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_ID" || (echo "::error::Missing GitHub Actions secret SUPABASE_PROJECT_ID" && exit 1)
          test "$SUPABASE_PROJECT_ID" = "rzsgdfpwnxhseyxtrrlx" || (echo "::error::SUPABASE_PROJECT_ID does not match the production project" && exit 1)

      - name: Deploy Ask AI to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy ask-garment-data --project-ref rzsgdfpwnxhseyxtrrlx
