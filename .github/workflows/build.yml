name: Verify Python-only Analytics application
on:
  push:
    branches: [main, "migration/python-only-web-app"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r python_backend/requirements.txt
      - name: Compile Python application
        run: python -m compileall -q python_backend
      - name: Run Python API and UI regression tests
        working-directory: python_backend
        env:
          FLASK_SECRET_KEY: ci-only-not-a-production-secret
        run: python -m unittest -v
