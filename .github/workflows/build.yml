name: Verify dashboard build and dependencies
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Run Ask AI analytics regression tests
        run: npm test
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Run Python Ask AI security and prompt tests
        run: |
          cd python_backend
          python -m unittest -v test_main.py
      - name: Scan tracked text files for common secret patterns
        run: node scripts/security-scan.mjs
      - name: Audit dependency tree
        run: npm audit
      - name: Build production app
        run: npm run build
