name: Verify dashboard build and dependencies
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Run Ask AI analytics regression tests
        run: npm test
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run Python Ask AI security and prompt tests
        run: |
          cd python_backend
          python -m unittest -v test_main.py
      - name: Scan tracked text files for common secret patterns
        run: node scripts/security-scan.mjs
      - name: Audit dependency tree
        run: npm audit
      - name: Build production app
        run: npm run build
