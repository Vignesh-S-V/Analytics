name: Deploy Analytics to Cloudflare Workers

# Production auto-deploy is owned by the Cloudflare Workers Builds
# connection for this Worker. Keep this workflow as a manual fallback only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY GEMINI_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Build dashboard assets
        env:
          VITE_BASE_PATH: "/"
        run: |
          npm ci
          npm run build

      - name: Install Python Worker tooling
        run: uv sync --group dev

      - name: Upload and deploy Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          UPSTREAM_TIMEOUT_SECONDS: ${{ secrets.UPSTREAM_TIMEOUT_SECONDS }}
        run: |
          set -euo pipefail

          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          python - <<'PY' > "$secret_file"
          import json
          import os

          names = (
              "SUPABASE_URL",
              "SUPABASE_ANON_KEY",
              "SUPABASE_SERVICE_ROLE_KEY",
              "GEMINI_API_KEY",
              "GEMINI_MODEL",
              "ALLOWED_ORIGINS",
              "UPSTREAM_TIMEOUT_SECONDS",
          )
          print(json.dumps({
              name: os.environ[name]
              for name in names
              if os.environ.get(name)
          }))
          PY

          # Retry transient Cloudflare API failures, but never hide auth,
          # permission, validation, or build errors.
          retry_cloudflare() {
            local max_attempts=5
            local attempt=1
            local output_file
            while [ "$attempt" -le "$max_attempts" ]; do
              output_file="$(mktemp)"
              set +e
              "$@" 2>&1 | tee "$output_file"
              local command_status=${PIPESTATUS[0]}
              set -e

              if [ "$command_status" -eq 0 ]; then
                rm -f "$output_file"
                return 0
              fi

              if grep -Eqi '(^|[^0-9])HTTP ([45][0-9][0-9])|[45][0-9][0-9] (Service Unavailable|Too Many Requests|Bad Gateway|Gateway Timeout)|no healthy upstream|ECONNRESET|ETIMEDOUT|socket hang up|fetch failed' "$output_file" \
                && [ "$attempt" -lt "$max_attempts" ]; then
                local delay=$((attempt * 20))
                echo "::warning::Transient Cloudflare API failure. Retrying in ${delay}s (attempt $((attempt + 1))/$max_attempts)."
                rm -f "$output_file"
                sleep "$delay"
                attempt=$((attempt + 1))
                continue
              fi

              rm -f "$output_file"
              return "$command_status"
            done
            return 1
          }

          api_base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/analytics"
          api_get() {
            curl --fail-with-body --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 45 \
              --connect-timeout 15 --max-time 60 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Accept: application/json" "$1"
          }

          upload_started="$(date -u +%s)"
          retry_cloudflare uv run pywrangler versions upload \
            --config wrangler.jsonc --secrets-file "$secret_file"

          versions_json="$(api_get "$api_base/versions?per_page=1")"
          version_id="$(printf '%s' "$versions_json" | python -c '
          import json, sys
          data = json.load(sys.stdin)
          if not data.get("success") or not data.get("result", {}).get("items"):
              raise SystemExit("Cloudflare did not return an uploaded Worker version")
          item = data["result"]["items"][0]
          if item.get("metadata", {}).get("source") != "wrangler":
              raise SystemExit("Latest Worker version was not uploaded by Wrangler")
          print(item["id"])
          ')"
          version_created="$(printf '%s' "$versions_json" | python -c '
          import json, sys
          print(json.load(sys.stdin)["result"]["items"][0]["metadata"]["created_on"])
          ')"
          created_epoch="$(date -u -d "$version_created" +%s)"
          if [ "$created_epoch" -lt "$((upload_started - 60))" ]; then
            echo "::error::The latest Cloudflare Worker version is stale; refusing to deploy it."
            exit 1
          fi

          echo "Uploaded Worker version: $version_id"
          retry_cloudflare uv run pywrangler versions deploy \
            "$version_id@100%" --yes --config wrangler.jsonc \
            --message "GitHub Actions deployment $GITHUB_SHA"

          deployments_json="$(api_get "$api_base/deployments?per_page=1")"
          printf '%s' "$deployments_json" | python -c '
          import json, sys
          data = json.load(sys.stdin)
          if not data.get("success"):
              raise SystemExit("Cloudflare deployment verification API returned success=false")
          deployments = data.get("result", {}).get("deployments", [])
          if not deployments:
              raise SystemExit("No Cloudflare Worker deployments were returned")
          deployment = deployments[0]
          versions = deployment.get("versions", [])
          if not any(item.get("version_id") == sys.argv[1] and float(item.get("percentage", 0)) == 100 for item in versions):
              raise SystemExit("The newly uploaded Worker version is not receiving 100% of traffic")
          print("Verified: Cloudflare Worker version " + sys.argv[1] + " receives 100% of traffic.")
          ' "$version_id"
