[project]
name = "threadiq-analytics-cloudflare"
version = "0.1.0"
description = "ThreadIQ Analytics server-rendered Flask app for Cloudflare Python Workers"
requires-python = ">=3.13"
dependencies = [
    "Flask==3.1.0",
    "fastapi==0.115.12",
    "httpx==0.28.1",
    "requests==2.32.3",
    "cachetools==5.5.2",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

# The repository is an application workspace, not a distributable Python
# package. Its importable application modules live under python_backend/.
# Explicitly disable setuptools flat-layout discovery so pip install .
# does not mistake unrelated top-level folders (sql/, python_backend/) for
# multiple packages in Cloudflare's build environment.
[tool.setuptools]
packages = []
