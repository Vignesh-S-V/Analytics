[project]
name = "threadiq-analytics-cloudflare"
version = "0.1.0"
description = "ThreadIQ Analytics server-rendered Flask app for Cloudflare Python Workers"
requires-python = ">=3.13"
dependencies = [
    "Flask==3.1.3",
    "fastapi==0.115.12",
    "httpx==0.28.1",
    "requests==2.33.0",
    "cachetools==5.5.2",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
